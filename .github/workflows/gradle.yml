name: Java CI with Gradle

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Start DB (docker-compose)
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: docker-compose.yml

      - name: Wait for MySQL (healthy)
        run: |
          for i in {1..60}; do
            status=$(docker inspect -f '{{.State.Health.Status}}' mysql-deadline 2>/dev/null || echo "starting")
            echo "mysql status: $status"
            if [ "$status" = "healthy" ]; then
              echo "MySQL is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL not healthy"
          docker ps -a
          docker logs mysql-deadline || true
          exit 1

      - name: Run SUT
        run: |
          # Оставляю твои переменные DB_* (если SUT их реально читает)
          export DB_URL="jdbc:mysql://127.0.0.1:3306/app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
          export DB_USER="app"
          export DB_PASS="pass"

          java -jar artifacts/app-deadline.jar > sut.log 2>&1 &
          echo $! > sut.pid
          echo "SUT PID=$(cat sut.pid)"

      - name: Wait for SUT
        run: |
          URL="http://127.0.0.1:9999/"
          for i in {1..60}; do
            if curl -sSf "$URL" >/dev/null; then
              echo "SUT is up: $URL"
              exit 0
            fi
            echo "Waiting for SUT... ($i)"
            sleep 2
          done
          echo "SUT failed to start"
          echo "---- sut.log ----"
          cat sut.log
          exit 1

      - name: Run tests
        run: ./gradlew test -Dselenide.headless=true --info

      - name: Debug logs (on failure)
        if: failure()
        run: |
          echo "---- sut.log ----"
          cat sut.log || true
          echo "---- mysql logs ----"
          docker logs mysql-deadline || true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test

      - name: Stop SUT (cleanup)
        if: always()
        run: |
          if [ -f sut.pid ]; then
            kill "$(cat sut.pid)" || true
          fi