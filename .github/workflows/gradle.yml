name: Java CI with Gradle

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Поднимаем MySQL из docker-compose.yml
      - name: Container start (docker-compose)
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: docker-compose.yml

      # Ждём healthcheck: healthy (использует твой healthcheck из compose)
      - name: Wait for MySQL (healthy)
        run: |
          for i in {1..60}; do
            status=$(docker inspect -f '{{.State.Health.Status}}' mysql-deadline 2>/dev/null || echo "starting")
            echo "mysql status: $status"
            if [ "$status" = "healthy" ]; then
              echo "MySQL is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "MySQL not healthy"
          docker ps -a
          docker logs mysql-deadline || true
          exit 1

      # Запускаем SUT (jar) и сохраняем логи
      - name: Run SUT
        run: |
          # Если app-deadline.jar — Spring Boot, чаще всего нужны именно эти переменные:
          export SPRING_DATASOURCE_URL="jdbc:mysql://127.0.0.1:3306/app?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
          export SPRING_DATASOURCE_USERNAME="app"
          export SPRING_DATASOURCE_PASSWORD="pass"

          java -jar artifacts/app-deadline.jar > sut.log 2>&1 &
          echo $! > sut.pid
          echo "SUT started with PID=$(cat sut.pid)"

      # Ждём, пока SUT реально поднимется
      - name: Wait for SUT
        run: |
          # Поменяй порт/URL если у твоего SUT другой
          URL="http://127.0.0.1:9999/"
          for i in {1..60}; do
            if curl -sSf "$URL" >/dev/null; then
              echo "SUT is up at $URL"
              exit 0
            fi
            echo "Waiting for SUT... ($i)"
            sleep 2
          done
          echo "SUT failed to start"
          echo "---- sut.log ----"
          cat sut.log
          exit 1

      # Запуск тестов
      - name: Run tests
        run: ./gradlew test -Dselenide.headless=true --info